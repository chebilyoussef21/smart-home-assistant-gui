#Github Actions workflow to build and push multi-arch Docker image to GHCR
#Triggered on push to main branch or new semver tag (vX.Y.Z)
#(This just pulls the target SO AUTOMATIC UPDATES CAN HAPPEN VIA Watchtower in docker-compose.yml)

name: build-and-push
on: #This workflow runs when: 
  push:
    branches: [ main ] #You push to the main branch
    tags: [ 'v*.*.*' ] #You create a new semantic version tag like v1.0.0 

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions: #Grants permission for 'docker' job to read repo contents and write to GHCR (GitHub Packages)
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4 #Pulls your code into the runner so it can build the image.

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 #Enables emulation for non-native architectures (e.g., building ARM images on x86).

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 #Activates Docker’s advanced builder that supports multi-arch builds.

      - name: Login to GHCR
        uses: docker/login-action@v3 #Authenticates with GitHub Container Registry using the GitHub token.
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: vars
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "tags=$IMAGE:latest,$IMAGE:${VER}" >> $GITHUB_OUTPUT
          else
            echo "tags=$IMAGE:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push (amd64 + arm64)
        uses: docker/build-push-action@v6 #- Builds the image for both x86 (amd64) and ARM (arm64) & Pushes it to GHCR with the computed tags

        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          provenance: false
