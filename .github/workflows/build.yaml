#Github Actions workflow to build and push multi-arch Docker image to GHCR
#Triggered on push to main branch or new semver tag (vX.Y.Z)
#(This just pulls the target SO AUTOMATIC UPDATES CAN HAPPEN VIA Watchtower in docker-compose.yml)

name: build-and-push
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: vars
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "tags=$IMAGE:latest,$IMAGE:${VER}" >> $GITHUB_OUTPUT
          else
            echo "tags=$IMAGE:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          provenance: false
